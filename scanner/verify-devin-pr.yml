name: verify-devin-pr
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      dedupe_key:
        description: "Orchestrator dedupe_key to verify"
        required: true
      pr_url:
        description: "PR URL (optional)"
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: verify-devin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Only run when the PR (or a workflow_dispatch) is tied to a remediation.
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'devin-remediation') ||
      startsWith(github.event.pull_request.head.ref, 'devin/remediate-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: python -m pip install pip-audit bandit

      - name: Find dedupe_key from PR
        id: key
        if: github.event_name == 'pull_request'
        env:
          ISSUE_BODIES: ${{ toJson(github.event.pull_request) }}
        run: |
          # The orchestrator embeds the dedupe_key in the tracking issue body.
          # The PR body usually says "Closes #N" — we dereference the issue.
          PR_BODY=$(jq -r '.body // ""' <<< "$ISSUE_BODIES")
          ISSUE_NUM=$(printf "%s" "$PR_BODY" | grep -oE '#[0-9]+' | head -n1 | tr -d '#')
          if [ -z "$ISSUE_NUM" ]; then
              echo "No tracking issue referenced in PR body"
              echo "key=" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          ISSUE_JSON=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUM")
          KEY=$(jq -r '.body // ""' <<< "$ISSUE_JSON" | grep -oE '`[0-9a-f]{16}`' | head -n1 | tr -d '`')
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run scanners on PR branch
        id: rescan
        continue-on-error: true
        run: |
          mkdir -p reports
          TARGET="superset"
          [ -d "$TARGET" ] || TARGET="."
          bandit -r "$TARGET" -ll -f json -o reports/bandit.json --quiet || true
          shopt -s nullglob
          for req in requirements*.txt requirements/*.txt; do
              [ -f "$req" ] || continue
              safe=$(echo "$req" | tr '/' '_')
              pip-audit -r "$req" --format json > "reports/pip-audit_${safe}.json" || true
          done

      - name: POST verification result
        env:
          ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}
          INGEST_SHARED_SECRET: ${{ secrets.INGEST_SHARED_SECRET }}
          DEDUPE_KEY: ${{ steps.key.outputs.key || inputs.dedupe_key }}
          PR_URL: ${{ github.event.pull_request.html_url || inputs.pr_url }}
        run: |
          if [ -z "${DEDUPE_KEY:-}" ]; then
            echo "No dedupe_key resolved; skipping POST"
            exit 0
          fi
          python - <<'PY'
          import glob, json, os, urllib.request, subprocess
          key = os.environ.get("DEDUPE_KEY")
          pr = os.environ.get("PR_URL")

          # Outcome = STILL_VULNERABLE if bandit reports anything medium+ OR pip-audit reports any vuln.
          outcome = "clean"
          details = []

          try:
              b = json.load(open("reports/bandit.json"))
              if b.get("results"):
                  outcome = "still_vuln"
                  details.append(f"bandit: {len(b['results'])} findings")
          except Exception:
              pass

          for p in glob.glob("reports/pip-audit_*.json"):
              try:
                  d = json.load(open(p))
                  vul = [x for x in d.get("dependencies", []) if x.get("vulns")]
                  if vul:
                      outcome = "still_vuln"
                      details.append(f"{p}: {sum(len(x['vulns']) for x in vul)} vulns across {len(vul)} packages")
              except Exception:
                  pass

          payload = {
              "dedupe_key": key,
              "pr_url": pr,
              "outcome": outcome,
              "scanner_output": "\n".join(details) or "scanner reports clean",
          }
          data = json.dumps(payload).encode()
          req = urllib.request.Request(
              os.environ["ORCHESTRATOR_URL"].rstrip("/") + "/verify/result",
              data=data, method="POST",
              headers={
                  "Content-Type": "application/json",
                  "X-Ingest-Secret": os.environ["INGEST_SHARED_SECRET"],
              },
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              print(r.read().decode())
          PY
